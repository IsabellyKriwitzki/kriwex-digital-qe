name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: application/backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: application/frontend
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start backend
        working-directory: application/backend
        run: npm run dev > backend.log 2>&1 &

      - name: Start frontend
        working-directory: application/frontend
        run: npm run dev > frontend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:3000/api/health > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to start"
          cat application/backend/backend.log
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:3001/health > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 2
          done

          echo "Frontend failed to start"
          cat application/frontend/frontend.log
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload backend log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: application/backend/backend.log
          retention-days: 30

      - name: Upload frontend log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-log
          path: application/frontend/frontend.log
          retention-days: 30

